name: 🧪 Run Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false

      matrix:
        config:
          - Release
          - Debug

        os:
          - macos-15-intel
          - macos-latest
          - windows-latest

        include:
          - os: ubuntu-latest
            config: Release
            container: ghcr.io/viennatools/vienna-builder:suite
          - os: ubuntu-latest
            config: Debug
            container: ghcr.io/viennatools/vienna-builder:suite

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    env:
      VCPKG_COMMIT: 72d876b20f06129a1b1e0db80c7075fe3e419d7c
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache

    name: "🧪 Test on ${{ matrix.os }} (⚙️: ${{ matrix.config }}, 💿: ${{ matrix.container || matrix.os }})"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🖥️ Setup Environment
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}

      - name: 📋 Install MacOS Dependencies
        if: ${{ startsWith(matrix.os, 'macos-') }}
        run: brew install vtk

      - name: 🖥️ Setup vcpkg (Windows)
        shell: pwsh
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue

          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout $env:VCPKG_COMMIT
          & .\vcpkg\bootstrap-vcpkg.bat

          "VCPKG_ROOT=$($env:GITHUB_WORKSPACE)\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      - name: 🦥 Cache vcpkg installed
        if: ${{ matrix.os == 'windows-latest' }}
        id: vcpkg-installed-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-installed-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: 🛠️ Build Dependencies (Windows)
        if: ${{ matrix.os == 'windows-latest' && steps.vcpkg-installed-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          # gl2ps (a VTK dependency) is only published on geuz.org, which times
          # out. vcpkg uses a file already in its downloads folder when the SHA512
          # matches, so the identical tarball is taken from the MacPorts mirror;
          # if that fails, vcpkg downloads as usual. Version and hash are those of
          # the gl2ps port at VCPKG_COMMIT.
          $gl2ps = "vcpkg/downloads/gl2ps-1.4.2.tgz"
          $sha512 = "46652e1b3825ace61dbd77c4b0bf451e7671c248eb18bbd3369e2fac00056ea4cd5d2578561984313c239e3b02f78b9d9a76d963c935af65a13bc2abfc538620"
          New-Item -ItemType Directory -Force -Path vcpkg/downloads | Out-Null
          try {
            Invoke-WebRequest -Uri "https://distfiles.macports.org/gl2ps/gl2ps-1.4.2.tgz" -OutFile $gl2ps
            if ((Get-FileHash -Algorithm SHA512 $gl2ps).Hash -ne $sha512) { throw "unexpected SHA512" }
          } catch {
            Write-Warning "gl2ps mirror: $($_.Exception.Message)"
            Remove-Item -Force -ErrorAction Ignore $gl2ps
          }
          ./vcpkg/vcpkg install --triplet x64-windows

      - name: 🏗️ Compile (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          cmake -DVIENNALS_BUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed -DVCPKG_MANIFEST_INSTALL=OFF -B build
          cmake --build build --config ${{ matrix.config }}

      - name: 🏗️ Compile (other)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          cmake -DVIENNALS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.config }} -B build
          cmake --build build --config ${{ matrix.config }}

      - name: 🧪 Test
        run: ctest --output-on-failure -E "Benchmark|Performance" -C ${{ matrix.config }} --test-dir build
